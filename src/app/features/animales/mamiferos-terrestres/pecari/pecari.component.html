<section class="hero-section">
    <div class="back-nav-container">
        <button class="back-btn" (click)="goBack()">
            <svg viewBox="0 0 24 24">
                <path fill="currentColor" d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
            </svg>
        </button>
    </div>

    <h1 class="hero-title">{{ 'MAMMALS.PECARI.TITLE' | translate }}</h1>

    <div class="hero-visual">
        <div class="parallax-container" [style.transform]="parallaxTransform()">
            <img src="assets/mammals/peccary.png" alt="Tayassu pecari - Pecarí Labiado" class="animal-image">
        </div>
    </div>

    <div class="hero-content">
        <div class="hero-body">
            <div class="hero-column">
                <p [innerHTML]="'MAMMALS.PECARI.BODY_1' | translate"></p>

                <!-- Read more button -->
                <button class="read-more-btn" (click)="toggleExpanded()">
                    {{ (isExpanded() ? 'COMMON.READ_LESS' : 'COMMON.READ_MORE') | translate }}
                    <mat-icon class="icon transition-transform duration-300" [class.rotate-180]="isExpanded()">
                        expand_more
                    </mat-icon>
                </button>

                <p [innerHTML]="'MAMMALS.PECARI.BODY_2' | translate" [class.content-hidden]="!isExpanded()"></p>
            </div>
            <div class="hero-column" [class.content-hidden]="!isExpanded()">
                <p [innerHTML]="'MAMMALS.PECARI.BODY_3' | translate"></p>
                <p>
                    {{ 'MAMMALS.PECARI.BODY_4' | translate }}
                    <span class="poetic-touch">{{ 'MAMMALS.PECARI.POEM' | translate }}</span>
                </p>
            </div>
        </div>
    </div>

    <div class="multimedia-section">
        <!-- Tabs Header (Desktop Only) -->
        <div class="multimedia-tabs-header">
            <button [class.active]="activeTab() === 'video'" (click)="setTab('video')">
                <svg viewBox="0 0 24 24" class="yt-icon">
                    <path fill="currentColor"
                        d="M21.58,7.19C21.35,6.33,20.67,5.65,19.81,5.42C18.25,5,12,5,12,5s-6.25,0-7.81,0.42c-0.86,0.23-1.54,0.91-1.77,1.77C2,8.75,2,12,2,12s0,3.25,0.42,4.81c0.23,0.86,0.91,1.54,1.77,1.77C5.75,19,12,19,12,19s6.25,0,7.81-0.42c0.86-0.23,1.54-0.91,1.77-1.77C22,15.25,22,12,22,12S22,8.75,21.58,7.19z M10,15.5v-7l6,3.5L10,15.5z" />
                </svg>
                {{ 'MAMMALS.PECARI.TABS.VIDEO' | translate }}
            </button>
        </div>

        <div class="multimedia-content-wrapper">
            <!-- Video Tab -->
            <div class="multimedia-item video-container">
                <h3>{{ 'MAMMALS.PECARI.VIDEO_TITLE' | translate }}</h3>
                <div class="video-container-iframe">
                    <iframe [src]="videoUrl()" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</section>
