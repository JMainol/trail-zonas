<section class="hero-section">
    <div class="back-nav-container">
        <button class="back-btn" (click)="goBack()">
            <svg viewBox="0 0 24 24">
                <path fill="currentColor" d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z" />
            </svg>
        </button>
    </div>
    <h1 class="hero-title">{{ 'PLANTS.MEDICINAL.SANGRE_DE_GRADO.TITLE' | translate }}</h1>

    <div class="hero-visual">
        <div class="parallax-container" [style.transform]="parallaxTransform()">
            <img src="assets/plants/sangre-de-grado.png" [alt]="'PLANTS.MEDICINAL.SANGRE_DE_GRADO.TITLE' | translate" class="plant-image">
        </div>
        <app-media-caption 
            [title]="'BIRDS.AI_CAPTION_TEXT' | translate"
            [author]="''"
            [iconType]="'ai'">
        </app-media-caption>
    </div>

    <div class="hero-content">
        <div class="hero-body">
            <div class="hero-column">
                <p [innerHTML]="'PLANTS.MEDICINAL.SANGRE_DE_GRADO.BODY_1' | translate"></p>

                <!-- Read more button - Mobile Only -->
                <button class="read-more-btn" (click)="toggleExpanded()">
                    {{ (isExpanded() ? 'COMMON.READ_LESS' : 'COMMON.READ_MORE') | translate }}
                    <mat-icon class="icon transition-transform duration-300" [class.rotate-180]="isExpanded()">
                        expand_more
                    </mat-icon>
                </button>

                <p [innerHTML]="'PLANTS.MEDICINAL.SANGRE_DE_GRADO.BODY_2' | translate" [class.mobile-hidden]="!isExpanded()"></p>
            </div>
            <div class="hero-column" [class.mobile-hidden]="!isExpanded()">
                <p [innerHTML]="'PLANTS.MEDICINAL.SANGRE_DE_GRADO.BODY_3' | translate"></p>
                <p [innerHTML]="'PLANTS.MEDICINAL.SANGRE_DE_GRADO.BODY_4' | translate"></p>
                <span class="poetic-touch">{{ 'PLANTS.MEDICINAL.SANGRE_DE_GRADO.POEM' | translate }}</span>
            </div>
        </div>
    </div>

    <div class="multimedia-section">
        <!-- Tabs Header -->
        <div class="multimedia-tabs-header">
            <button [class.active]="activeTab() === 'video'" (click)="setTab('video')">
                <svg viewBox="0 0 24 24" class="yt-icon">
                    <path fill="currentColor"
                        d="M21.58,7.19C21.35,6.33,20.67,5.65,19.81,5.42C18.25,5,12,5,12,5s-6.25,0-7.81,0.42c-0.86,0.23-1.54,0.91-1.77,1.77C2,8.75,2,12,2,12s0,3.25,0.42,4.81c0.23,0.86,0.91,1.54,1.77,1.77C5.75,19,12,19,12,19s6.25,0,7.81-0.42c0.86-0.23,1.54-0.91,1.77-1.77C22,15.25,22,12,22,12S22,8.75,21.58,7.19z M10,15.5v-7l6,3.5L10,15.5z" />
                </svg>
                {{ 'PLANTS.MEDICINAL.SANGRE_DE_GRADO.TABS.VIDEO' | translate }}
            </button>
            <button [class.active]="activeTab() === 'properties'" (click)="setTab('properties')">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M19,3H5C3.89,3 3,3.89 3,5V19C3,20.1 3.89,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.89 20.1,3 19,3M19,19H5V5H19V19M7,7H17V9H7V7M7,11H17V13H7V11M7,15H17V17H7V15Z" />
                </svg>
                {{ 'PLANTS.MEDICINAL.SANGRE_DE_GRADO.TABS.PROPERTIES' | translate }}
            </button>
        </div>

        <div class="multimedia-content-wrapper">
            <!-- Video Tab -->
            <div class="multimedia-item video-container" [class.tab-hidden]="activeTab() !== 'video'">
                <h3>{{ 'PLANTS.MEDICINAL.SANGRE_DE_GRADO.VIDEO_TITLE' | translate }}</h3>
                <div class="video-container-iframe">
                    <iframe [src]="videoUrl()" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

            <!-- Properties Tab -->
            <div class="multimedia-item properties-container" [class.tab-hidden]="activeTab() !== 'properties'">
                <h3>{{ 'PLANTS.MEDICINAL.SANGRE_DE_GRADO.PROPERTIES_TITLE' | translate }}</h3>
                <div class="properties-content">
                    <ul class="properties-list">
                        <li><span [innerHTML]="'PLANTS.MEDICINAL.SANGRE_DE_GRADO.PROPERTIES_LIST.0' | translate"></span></li>
                        <li><span [innerHTML]="'PLANTS.MEDICINAL.SANGRE_DE_GRADO.PROPERTIES_LIST.1' | translate"></span></li>
                        <li><span [innerHTML]="'PLANTS.MEDICINAL.SANGRE_DE_GRADO.PROPERTIES_LIST.2' | translate"></span></li>
                        <li><span [innerHTML]="'PLANTS.MEDICINAL.SANGRE_DE_GRADO.PROPERTIES_LIST.3' | translate"></span></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>
