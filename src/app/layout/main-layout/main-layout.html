<div class="app-layout">

  <!-- Menú de Navegación Principal (Header) -->
  <app-nav-menu></app-nav-menu>

  <!-- Contenido Principal (Proyección) -->
  <main class="content-container">
    <ng-content></ng-content>
  </main>

  <footer class="main-footer">
    <div class="footer-top-line"></div>
    <div class="footer-inner">
      <div class="footer-brand">
        <span class="footer-logo">{{ 'BRAND.NAME' | translate }}</span>
        <p class="footer-tagline">{{ 'LAYOUT.FOOTER.SUBTITLE' | translate }}</p>
      </div>
      <nav class="footer-nav" aria-label="Footer navigation">
        <a routerLink="/mision" class="footer-nav-link" id="footer-link-mision">
          <span class="footer-nav-dot"></span>
          {{ 'LAYOUT.FOOTER.NAV_MISION' | translate }}
        </a>
        <a routerLink="/amazonia/contacto" class="footer-nav-link" id="footer-link-colaboradores">
          <span class="footer-nav-dot"></span>
          {{ 'LAYOUT.FOOTER.NAV_COLABORADORES' | translate }}
        </a>
      </nav>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2025 <span class="footer-highlight">Amazonas Jungle</span>. {{ 'LAYOUT.FOOTER.COPYRIGHT' | translate }}</p>
    </div>
  </footer>

</div>
