    <!-- Sección del Mapa Interactivo -->

    <!-- Sección de Texto con Efecto Scroll (Discover Amazon) -->
    <section class="content">

        <div class="content__title" [innerHTML]="contentTitle()">
        </div>

        <div class="home-marquee-container">
            <div class="home-marquee-text">
                {{ 'HOME.MARQUEE' | translate }}
            </div>
        </div>

        <!-- Indicador de Scroll / Botón Volver Arriba -->
        <div class="scroll-indicator" [class.is-back-to-top]="showBackToTop()" (click)="showBackToTop() && scrollToTop()">
            <span class="scroll-text">{{ (showBackToTop() ? 'HOME.BACK_TO_TOP' : 'HOME.SCROLL') | translate }}</span>
            <div class="scroll-line">
                <div class="scroll-dot"></div>
            </div>
        </div>

        <div *ngFor="let text of contentTexts()" class="content__text" [innerHTML]="text">
        </div>

    </section>

</div>
