<div class="media-caption"
     [class.clickable]="!!authorUrl()"
     [ngClass]="'type-' + iconType()"
     (click)="onNavigate()"
     [title]="authorUrl() ? ('Ir a la web de ' + author()) : ''">

    <!-- Dynamic Icon -->
    <div class="link-icon" *ngIf="iconType()">
        <!-- AI Icon -->
        <mat-icon *ngIf="iconType() === 'ai'">auto_awesome</mat-icon>

        <!-- YouTube Icon -->
        <svg *ngIf="iconType() === 'youtube'" viewBox="0 0 24 24">
            <path fill="currentColor" d="M21.58,7.19C21.35,6.33,20.67,5.65,19.81,5.42C18.25,5,12,5,12,5s-6.25,0-7.81,0.42c-0.86,0.23-1.54,0.91-1.77,1.77C2,8.75,2,12,2,12s0,3.25,0.42,4.81c0.23,0.86,0.91,1.54,1.77,1.77C5.75,19,12,19,12,19s6.25,0,7.81-0.42c0.86-0.23,1.54-0.91,1.77-1.77C22,15.25,22,12,22,12S22,8.75,21.58,7.19z M10,15.5v-7l6,3.5L10,15.5z" />
        </svg>

        <!-- Instagram Icon -->
        <svg *ngIf="iconType() === 'instagram'" viewBox="0 0 24 24">
            <path fill="currentColor" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z" />
        </svg>

        <!-- Web Icon -->
        <mat-icon *ngIf="iconType() === 'web'">public</mat-icon>
    </div>

    <span class="caption-title">{{ title() }}</span>
    <ng-container *ngIf="author()">
        <span class="caption-separator"> {{ 'COMMON.CAPTION_BY' | translate }} </span>
        <span class="caption-author" [innerHTML]="author() | safeHtml" (click)="handleContentClick($event)"></span>
    </ng-container>
</div>
